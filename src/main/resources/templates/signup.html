<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow - Register</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">
    <h3 class="text-center mb-4">Create AssetFlow Account</h3>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="row mb-3">
            <div class="col">
                <label for="firstName" class="form-label">First Name:</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
            </div>
            <div class="col">
                <label for="lastName" class="form-label">Last Name:</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address:</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="user@example.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" required>
        </div>

        <div class="mb-3">
            <label for="role" class="form-label">Account Role:</label>
            <select class="form-select" id="role" th:field="*{role}">
                <option th:each="roleOpt : ${T(com.example.assettracker.domain.Role).values()}"
                th:value="${roleOpt}"
                th:text="${roleOpt}">USER</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success w-100">Sign Up</button>
    </form>

    <div class="text-center mt-3">
        <small>Already have an account? <a th:href="@{/login}">Log in</a></small>
    </div>
</div>
</body>
</html>

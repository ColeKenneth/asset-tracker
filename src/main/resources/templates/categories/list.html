<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AssetFlow - Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Category Management</h2>
            <p class="text-muted mb-0">Manage hardware categories and asset classifications</p>
        </div>
        <a th:href="@{/assets}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Assets
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="card-title mb-0 fw-semibold"><i class="bi bi-plus-circle me-2"></i>Add New Category</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/categories}" th:object="${createCategoryRequest}" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label for="name" class="form-label fw-medium">Category Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               placeholder="e.g. Laptops, Monitors" required>
                    </div>
                    <div class="col-md-5">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <input type="text" id="description" th:field="*{description}" class="form-control"
                               placeholder="Optional description">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-plus-lg me-1"></i> Add
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 fw-semibold text-secondary">Existing Categories</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 10%;">ID</th>
                    <th scope="col" style="width: 30%;">Name</th>
                    <th scope="col" style="width: 60%;">Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td class="fw-bold text-muted" th:text="${category.id}">1</td>
                    <td class="fw-semibold" th:text="${category.name}">Laptops</td>
                    <td class="text-muted" th:text="${#strings.isEmpty(category.description) ? '-' : category.description}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="3" class="text-center py-4 text-muted">No categories created yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

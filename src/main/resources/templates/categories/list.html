<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Categories - AssetFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Category Management</h2>
        <a th:href="@{/assets}" class="btn btn-outline-secondary btn-sm">&lAarr; Back to Assets</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="card-header bg-primary text-white font-monospace fw-bold">
            Add New Category
        </div>

        <div class="card-body">
            <form th:action="@{/categories}" th:object="${createCategoryRequest}" method="post" class="row g-3">
                <div class="col-md-5">
                    <label for="name" class="form-label fw-bold">Category Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="e.g. Laptops" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="col-md-5">
                    <label for="description" class="form-label fw-bold">Description</label>
                    <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="Optional description">
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">+ Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white font-monospace fw-bold">
        Existing Categories
    </div>

    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.id()}">1</td>
                <td class="fw-bold" th:text="${cat.name()}">Laptops</td>
                <td th:text="${cat.description() != null && cat.description().isBlank() ? cat.description() : '-'}">Portable computers</td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="3" class="text-center py-4 text-muted">No categories created yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0">Edit Asset</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/assets/edit/{id}(id=${asset.id()})}" th:object="${asset}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Asset Name</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}" />
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label fw-bold">Status</label>
                    <select id="status" class="form-select" th:field="*{status}">
                        <option th:each="s : ${T(com.example.assettracker.domain.AssetStatus).values()}"
                                th:value="${s}"
                                th:text="${s}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="purchaseCost" class="form-label fw-bold">Purchase Cost</label>
                    <input type="number" step="0.01" id="purchaseCost" class="form-control" th:field="*{purchaseCost}" />
                </div>

                <div class="mb-3">
                    <label for="categoryId" class="form-label fw-bold">Category ID</label>
                    <input type="number" id="categoryId" class="form-control" th:field="*{categoryId}" />
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/assets}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow - Asset Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">AssetFlow</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" sec:authentication="name">User</span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Hardware Assets</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/assets/new}" class="btn btn-primary">+ Add New Asset</a>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <th>Asset Tag</th>
            <th>Name</th>
            <th>Category</th>
            <th>Status</th>
            <th sec:authorize="hasRole('ADMIN')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asset : ${assets}">
            <td th:text="${asset.assetTag}">LAP-001</td>
            <td th:text="${asset.name}">MacBook Pro</td>
            <td th:text="${asset.categoryName}">Laptops</td>
            <td>
                <span class="badge bg-success" th:text="${asset.status}">AVAILABLE</span>
            </td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/assets/edit/{id}(id=${asset.id})}" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
                <form th:action="@{/assets/delete/{id}(id=${asset.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete asset?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

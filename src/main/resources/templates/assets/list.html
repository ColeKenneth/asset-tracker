<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow - Asset Dashboard</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">AssetFlow</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" sec:authentication="name">User</span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Hardware Assets</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/assets/new}" class="btn btn-primary">+ Add New Asset</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/assets}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" name="search" class="form-control" placeholder="Search by name, tag, or serial..."
                    th:value="${searchKeyword}">
                </div>

                <div class="col-md-3">
                    <select name="categoryId" class="form-select">
                        <option value="">All categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.categoryId}"
                                th:text="${cat.name}"
                                th:selected="${cat.categoryId == selectedCategory}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                    <a th:href="@{/assets}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <th>Asset Tag</th>
            <th>Name</th>
            <th>Category</th>
            <th>Status</th>
            <th sec:authorize="hasRole('ADMIN')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asset : ${assets}">
            <td th:text="${asset.assetTag}">LAP-001</td>
            <td th:text="${asset.name}">MacBook Pro</td>
            <td th:text="${asset.categoryName != null ? asset.categoryName : 'Uncategorized'}">Laptops</td>
            <td>
                <span th:classappend="${asset.status.name() == 'AVAILABLE' ? 'bg-success' : 'bg-primary'}"
                      class="badge" th:text="${asset.status}">AVAILABLE</span>
            </td>
            <td sec:authorize="hasRole('ADMIN')" class="text-end">
                <a th:href="@{/assets/{id}/assign(id=${asset.id})}" class="btn btn-sm btn-outline-success me-1">Assign</a>
                <a th:href="@{/assets/edit/{id}(id=${asset.id})}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                <form th:action="@{/assets/{id}/delete(id=${asset.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this asset?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(assets)}">
            <td colspan="5" class="text-center py-4 text-muted">No assets found matching your criteria.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${assetPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${assetPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/assets(page=${assetPage.number - 1}, search=${searchKeyword},
                categoryId=${selectedCategory}, status=${selectedStatus})}">Previous</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, assetPage.totalPages - 1)}"
            th:classappend="${i == assetPage.number} ? 'active'">
                <a class="page-link" th:href="@{/assets(page=${i}, search=${searchKeyword}, categoryId=${selectedCategory},
                status=${selectedStatus})}">1</a>
            </li>

            <li class="page-item" th:classappend="${assetPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/assets(page=${assetPage.number + 1}, search=${searchKeyword},
                categoryId=${selectedCategory}, status=${selectedStatus})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>

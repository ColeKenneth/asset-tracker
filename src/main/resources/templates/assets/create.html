<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AssetFlow - Add New Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0">Add New Asset</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/assets/new}" th:object="${assetRequest}" method="post">
                <div class="mb-3">
                    <label for="assetTag" class="form-label fw-bold">Asset Tag</label>
                    <input type="text" id="assetTag" class="form-control" th:field="*{assetTag}"
                    th:classappend="${#fields.hasErrors('assetTag')} ? 'is-invalid'" placeholder="e.g., AST-001">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('assetTag')}" th:errors="*{assetTag}"></div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Asset Name</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}"
                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="e.g., ThinkPad T14">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="serialNumber" class="form-label fw-bold">Serial Number</label>
                    <input type="text" id="serialNumber" class="form-control" th:field="*{serialNumber}"
                    th:classappend="${#fields.hasErrors('serialNumber')} ? 'is-invalid'" placeholder="e.g. SN-9948102">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="purchaseCost" class="form-label fw-bold">Purchase Cost</label>
                    <input type="number" step="0.01" id="purchaseCost" class="form-control" th:field="*{purchaseCost}"
                    th:classappend="${#fields.hasErrors('purchaseCost')} ? 'is-invalid'" placeholder="0.00">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('purchaseCost')}" th:errors="*{purchaseCost}"></div>
                </div>

                <div class="mb-3">
                    <label for="purchaseDate" class="form-label fw-bold">Purchase Date</label>
                    <input type="date" id="purchaseDate" class="form-control" th:field="*{purchaseDate}"
                    th:classappend="${#fields.hasErrors('purchaseDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('purchaseDate')}" th:errors="*{purchaseDate}"></div>
                </div>

                <div class="mb-3">
                    <label for="categoryId" class="form-label fw-bold">Category</label>
                    <select id="categoryId" class="form-select" th:field="*{categoryId}"
                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                        <option value="" disabled>Select Category</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id != null ? cat.id : cat.categoryId}"
                                th:text="${cat.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/assets}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Asset</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

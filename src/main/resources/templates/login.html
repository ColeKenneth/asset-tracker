<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">AssetFlow Login</h3>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid email or password.</div>

    <div th:if="${param.logout}" class="alert alert-success" role="alert">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Email Address:</label>
            <input type="text" class="form-control" name="username" id="username" required placeholder="admin@assetflow.com">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" name="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
</div>
</body>
</html>
